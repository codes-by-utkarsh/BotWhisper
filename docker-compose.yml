version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco-secure-store
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    networks:
      - ctf-network
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco-secure-admin-bot
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128M
      - /home/ctfuser/.cache:noexec,nosuid,size=256M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    networks:
      - ctf-network
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 200
    depends_on:
      web:
        condition: service_healthy
    command: ["tail", "-f", "/dev/null"]

networks:
  ctf-network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16
