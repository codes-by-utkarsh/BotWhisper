services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco-secure-store
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    tmpfs:
      - /tmp:size=256M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - ctf-network
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ctf-network:
    driver: bridge
    internal: false
